openapi: 3.1.0
info:
  title: Binokel Score Tracker API
  version: '1.0'
  description: >-
    Handgeschriebener API-Vertrag für den Binokel Score Tracker (V1).

    Normative Quellen: backend/binokel_tracker/urls.py, backend/scoring/views.py,
    docs/rule-set-v1.md. Kein DRF (ADR-005) – die Django-Views liefern JsonResponse.

    Änderungen an den Django-Views MÜSSEN hier nachgezogen werden (PFLICHT-Sync).

servers:
  - url: /
    description: Same-Origin (Frontend und API unter derselben Domain, ADR-010)

tags:
  - name: Spiel
    description: Spiel anlegen und laden (Slice 1)
  - name: Runde
    description: Runde auswerten und speichern (Slices 2–5)
  - name: Auswertung
    description: Punktestände und Sieger (Slice 6)
  - name: System
    description: Betrieb / Healthcheck

paths:
  /health/:
    get:
      tags: [System]
      operationId: healthcheck
      summary: Healthcheck für die Deployment-Pipeline
      responses:
        '200':
          description: Dienst ist erreichbar.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/spiele/:
    post:
      tags: [Spiel]
      operationId: spielAnlegen
      summary: Neues Spiel anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpielAnlegenRequest'
      responses:
        '201':
          description: Spiel angelegt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spiel'
        '400':
          $ref: '#/components/responses/Fehler'
        '405':
          $ref: '#/components/responses/Fehler'

  /api/spiele/{spiel_id}/:
    parameters:
      - $ref: '#/components/parameters/SpielId'
    get:
      tags: [Spiel]
      operationId: spielLaden
      summary: Spiel laden
      responses:
        '200':
          description: Spiel gefunden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spiel'
        '404':
          $ref: '#/components/responses/Fehler'

  /api/spiele/{spiel_id}/runden/:
    parameters:
      - $ref: '#/components/parameters/SpielId'
    get:
      tags: [Runde]
      operationId: rundenHistorieLaden
      summary: Rundenhistorie (Anschreibetabelle) laden
      description: >-
        Liefert je Runde die getrennte M|S|Mit-Aufschlüsselung pro Spieler und
        den kumulierten STAND-Zwischenstand (zweizeilige Anschreibetabelle,
        normativ: docs/Anschreibetabelle_3_und_4_Spieler.md §5). Ohne Runden wird eine
        leere Historie mit 200 geliefert (kein 404). Die letzte STAND-Zeile
        entspricht garantiert `punktestaendeLaden`.
      responses:
        '200':
          description: Rundenhistorie (ggf. leer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rundenhistorie'
        '404':
          $ref: '#/components/responses/Fehler'
    post:
      tags: [Runde]
      operationId: rundeAuswerten
      summary: Runde auswerten und speichern
      description: >-
        Der Request-Body wird über das Feld `typ` diskriminiert. Je nach
        Rundentyp gelten unterschiedliche Pflichtfelder
        (normativ: docs/rule-set-v1.md §13–§15).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RundeRequest'
      responses:
        '201':
          description: Runde ausgewertet und gespeichert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RundeErgebnis'
        '400':
          $ref: '#/components/responses/Fehler'
        '404':
          $ref: '#/components/responses/Fehler'
        '405':
          $ref: '#/components/responses/Fehler'

  /api/spiele/{spiel_id}/runden/{rundennummer}/:
    parameters:
      - $ref: '#/components/parameters/SpielId'
      - name: rundennummer
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: >-
          1-basierte Rundennummer. Nur die höchste (zuletzt erfasste) Runde ist
          editierbar (ADR-015).
    put:
      tags: [Runde]
      operationId: letzteRundeAktualisieren
      summary: Korrektur der letzten Runde
      description: >-
        Überschreibt die zuletzt erfasste Runde in-place (nur die höchste
        rundennummer, ADR-015). Der Geber wird deterministisch aus der
        Rundennummer abgeleitet und NICHT aus dem Body übernommen (HOCH-5).
        Typ-Übergänge (tausender↔normal) schalten Gegenspieler-Zeilen und Sterne
        korrekt um. Statuscodes: Nicht-letzte Runde → 409, nicht existente
        Runde/Spiel → 404, Validierungsfehler → 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RundeKorrekturRequest'
      responses:
        '200':
          description: Runde korrigiert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RundeErgebnis'
        '400':
          $ref: '#/components/responses/Fehler'
        '404':
          $ref: '#/components/responses/Fehler'
        '405':
          $ref: '#/components/responses/Fehler'
        '409':
          $ref: '#/components/responses/Fehler'

  /api/spiele/{spiel_id}/punktestaende/:
    parameters:
      - $ref: '#/components/parameters/SpielId'
    get:
      tags: [Auswertung]
      operationId: punktestaendeLaden
      summary: Aktuelle Punktestände aller Spieler
      responses:
        '200':
          description: Punktestände berechnet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Punktestaende'
        '404':
          $ref: '#/components/responses/Fehler'

  /api/spiele/{spiel_id}/sieger/:
    parameters:
      - $ref: '#/components/parameters/SpielId'
    get:
      tags: [Auswertung]
      operationId: siegerErmitteln
      summary: Sieger nach Spielende ermitteln
      parameters:
        - name: exakte_stichwerte
          in: query
          required: false
          description: >-
            Optionale exakte Stichwerte für das Tiebreaking mit 1er-Werten
            (normativ: docs/rule-set-v1.md §9.3).
            Format: kommaseparierte `Name:Wert`-Paare, z. B. `Anna:12,Bernd:7`.
          schema:
            type: string
          example: 'Anna:12,Bernd:7'
      responses:
        '200':
          description: Sieger ermittelt (leer, wenn kein eindeutiger Sieger).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiegerErgebnis'
        '400':
          $ref: '#/components/responses/Fehler'
        '404':
          $ref: '#/components/responses/Fehler'

components:
  parameters:
    SpielId:
      name: spiel_id
      in: path
      required: true
      description: Datenbank-ID des Spiels.
      schema:
        type: integer
        minimum: 1

  responses:
    Fehler:
      description: Fehlerantwort mit menschenlesbarer Meldung.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fehler'

  schemas:
    Fehler:
      type: object
      required: [fehler]
      properties:
        fehler:
          type: string
          description: Menschenlesbare Fehlermeldung (deutsch).
      examples:
        - fehler: "Pflichtfeld fehlt: 'spieler'."

    SpielAnlegenRequest:
      type: object
      required: [spieler]
      properties:
        spieler:
          type: array
          description: >-
            Spielernamen in Sitzreihenfolge gegen den Uhrzeigersinn. 3 oder 4 Spieler
            (rule-set-v1.md §2, ADR-017). Die Anzahl bestimmt die Variante: bei 4 Spielern
            setzt der Geber aus, bei 3 Spielern spielt er mit.
          items:
            type: string
          minItems: 3
          maxItems: 4
        rundenanzahl:
          type: [integer, 'null']
          description: >-
            Gesamtzahl der Runden. Muss ein Vielfaches der Spielerzahl sein (4 bzw. 3).
            Optional; Default 12 (durch 3 und 4 teilbar, daher für beide Varianten gültig).
      examples:
        - spieler: [Anna, Bernd, Clara, David]
          rundenanzahl: 12
        - spieler: [Anna, Bernd, Clara]
          rundenanzahl: 12

    Spiel:
      type: object
      required: [id, rundenanzahl, spieler]
      properties:
        id:
          type: integer
          description: Datenbank-ID des Spiels.
        rundenanzahl:
          type: integer
        spieler:
          type: array
          items:
            type: string

    Gegenspieler:
      type: object
      description: Gegenspieler-Daten mit vollem Stich-Zwang (typ normal / doppeltes_abgehen).
      required: [name, meldepunkte, stichwerte, hat_eigenen_stich]
      properties:
        name:
          type: string
        meldepunkte:
          type: integer
          minimum: 0
          maximum: 1800
          description: Meldepunkte des Spielers (Plausibilitätsgrenze, rule-set-v1.md §7.1).
        stichwerte:
          type: integer
        hat_eigenen_stich:
          type: boolean

    GegenspielerEinfach:
      type: object
      description: Gegenspieler-Daten ohne Stich-Zwang (typ einfaches_abgehen).
      required: [name, meldepunkte]
      properties:
        name:
          type: string
        meldepunkte:
          type: integer
          minimum: 0
          maximum: 1800
          description: Meldepunkte des Spielers (Plausibilitätsgrenze, rule-set-v1.md §7.1).
        hat_eigenen_stich:
          type: boolean
          default: false

    RundeBasis:
      type: object
      required: [typ, spielmacher, geber]
      properties:
        typ:
          $ref: '#/components/schemas/Rundentyp'
        rundennummer:
          type: integer
          description: >-
            Optional/ignoriert. Die Erfassungs-Sequenz (rundennummer) wird serverseitig
            als max+1 vergeben (FND-006/ADR-016); ein im Body übergebener Wert wird
            NICHT verwendet.
          minimum: 1
        spielmacher:
          type: string
          description: >-
            Muss in der Runde aktiv mitspielen (rule-set-v1.md §3.4): bei 4 Spielern also nicht
            der Geber (400), bei 3 Spielern darf es der mitspielende Geber sein (ADR-017).
        geber:
          type: string
        spielmacher_stern:
          type: boolean
          default: false
        gegenspieler_stern:
          type: boolean
          default: false

    Rundentyp:
      type: string
      enum:
        - normal
        - einfaches_abgehen
        - doppeltes_abgehen
        - tausender_gewonnen
        - tausender_verloren

    RundeNormal:
      allOf:
        - $ref: '#/components/schemas/RundeBasis'
        - type: object
          required: [reizwert, meldepunkte, stichwerte, hat_eigenen_stich, gegenspieler]
          properties:
            reizwert:
              type: integer
            meldepunkte:
              type: integer
              minimum: 0
              maximum: 1800
              description: Meldepunkte des Spielmachers (Plausibilitätsgrenze, rule-set-v1.md §7.1).
            stichwerte:
              type: integer
            hat_eigenen_stich:
              type: boolean
            gegenspieler:
              type: array
              items:
                $ref: '#/components/schemas/Gegenspieler'

    RundeEinfachesAbgehen:
      allOf:
        - $ref: '#/components/schemas/RundeBasis'
        - type: object
          required: [reizwert, gegenspieler]
          properties:
            reizwert:
              type: integer
            gegenspieler:
              type: array
              items:
                $ref: '#/components/schemas/GegenspielerEinfach'

    RundeDoppeltesAbgehen:
      allOf:
        - $ref: '#/components/schemas/RundeBasis'
        - type: object
          required: [reizwert, gegenspieler]
          properties:
            reizwert:
              type: integer
            gegenspieler:
              type: array
              items:
                $ref: '#/components/schemas/Gegenspieler'

    RundeTausender:
      description: >-
        typ tausender_gewonnen / tausender_verloren – kein numerischer Einfluss
        auf den Punktestand (rule-set-v1.md §15). Nur die Basisfelder werden benötigt.
      allOf:
        - $ref: '#/components/schemas/RundeBasis'

    RundeRequest:
      oneOf:
        - $ref: '#/components/schemas/RundeNormal'
        - $ref: '#/components/schemas/RundeEinfachesAbgehen'
        - $ref: '#/components/schemas/RundeDoppeltesAbgehen'
        - $ref: '#/components/schemas/RundeTausender'
      discriminator:
        propertyName: typ
        mapping:
          normal: '#/components/schemas/RundeNormal'
          einfaches_abgehen: '#/components/schemas/RundeEinfachesAbgehen'
          doppeltes_abgehen: '#/components/schemas/RundeDoppeltesAbgehen'
          tausender_gewonnen: '#/components/schemas/RundeTausender'
          tausender_verloren: '#/components/schemas/RundeTausender'

    RundeKorrekturBasis:
      type: object
      required: [typ, spielmacher]
      description: >-
        Wie RundeBasis, aber OHNE `geber` und `rundennummer`: Der Geber wird bei
        der Korrektur deterministisch aus der Rundennummer abgeleitet (HOCH-5),
        die Rundennummer stammt aus dem Pfad. Ein im Body übergebener `geber`
        wird ignoriert.
      properties:
        typ:
          $ref: '#/components/schemas/Rundentyp'
        spielmacher:
          type: string
        spielmacher_stern:
          type: boolean
          default: false
        gegenspieler_stern:
          type: boolean
          default: false

    RundeKorrekturNormal:
      allOf:
        - $ref: '#/components/schemas/RundeKorrekturBasis'
        - type: object
          required: [reizwert, meldepunkte, stichwerte, hat_eigenen_stich, gegenspieler]
          properties:
            reizwert:
              type: integer
            meldepunkte:
              type: integer
              minimum: 0
              maximum: 1800
            stichwerte:
              type: integer
            hat_eigenen_stich:
              type: boolean
            gegenspieler:
              type: array
              items:
                $ref: '#/components/schemas/Gegenspieler'

    RundeKorrekturEinfachesAbgehen:
      allOf:
        - $ref: '#/components/schemas/RundeKorrekturBasis'
        - type: object
          required: [reizwert, gegenspieler]
          properties:
            reizwert:
              type: integer
            gegenspieler:
              type: array
              items:
                $ref: '#/components/schemas/GegenspielerEinfach'

    RundeKorrekturDoppeltesAbgehen:
      allOf:
        - $ref: '#/components/schemas/RundeKorrekturBasis'
        - type: object
          required: [reizwert, gegenspieler]
          properties:
            reizwert:
              type: integer
            gegenspieler:
              type: array
              items:
                $ref: '#/components/schemas/Gegenspieler'

    RundeKorrekturTausender:
      description: >-
        typ tausender_gewonnen / tausender_verloren – nur die Basisfelder werden
        benötigt (rule-set-v1.md §15).
      allOf:
        - $ref: '#/components/schemas/RundeKorrekturBasis'

    RundeKorrekturRequest:
      oneOf:
        - $ref: '#/components/schemas/RundeKorrekturNormal'
        - $ref: '#/components/schemas/RundeKorrekturEinfachesAbgehen'
        - $ref: '#/components/schemas/RundeKorrekturDoppeltesAbgehen'
        - $ref: '#/components/schemas/RundeKorrekturTausender'
      discriminator:
        propertyName: typ
        mapping:
          normal: '#/components/schemas/RundeKorrekturNormal'
          einfaches_abgehen: '#/components/schemas/RundeKorrekturEinfachesAbgehen'
          doppeltes_abgehen: '#/components/schemas/RundeKorrekturDoppeltesAbgehen'
          tausender_gewonnen: '#/components/schemas/RundeKorrekturTausender'
          tausender_verloren: '#/components/schemas/RundeKorrekturTausender'

    RundeErgebnis:
      type: object
      required:
        - id
        - rundennummer
        - rundenausgang
        - spielmacher_punkte
        - verlustwert
        - mitpunkte_pro_gegenspieler
      properties:
        id:
          type: integer
        rundennummer:
          type: integer
        rundenausgang:
          type: string
          description: Fachliche Ergebnis-Klassifikation der Runde (Klartext).
          enum:
            - gewonnenes Spiel
            - doppeltes Abgehen
            - einfaches Abgehen
            - Tausender gewonnen
            - Tausender verloren
        spielmacher_punkte:
          type: integer
        verlustwert:
          type: integer
          description: Negativer Verlustwert bei Abgehen; sonst 0.
        mitpunkte_pro_gegenspieler:
          type: integer

    Punktestaende:
      type: object
      required: [spiel_id, punktestaende, sterne]
      properties:
        spiel_id:
          type: integer
        punktestaende:
          type: object
          description: Mapping Spielername → aktueller Gesamtpunktestand.
          additionalProperties:
            type: integer
        sterne:
          type: object
          description: Mapping Spielername → Anzahl Tausender-Sterne.
          additionalProperties:
            type: integer
      examples:
        - spiel_id: 1
          punktestaende:
            Anna: 340
            Bernd: 90
            Clara: 90
            David: 0
          sterne:
            Anna: 1
            Bernd: 0
            Clara: 0
            David: 0

    SiegerErgebnis:
      type: object
      required: [spiel_id, punktestaende, sterne, sieger]
      properties:
        spiel_id:
          type: integer
        punktestaende:
          type: object
          additionalProperties:
            type: integer
        sterne:
          type: object
          description: Mapping Spielername → Anzahl Tausender-Sterne.
          additionalProperties:
            type: integer
        sieger:
          type: array
          description: Sieger-Namen; leer, wenn kein eindeutiger Sieger feststeht.
          items:
            type: string

    HistorieSpielerZeile:
      type: object
      description: >-
        M|S|Mit-Aufschlüsselung eines Spielers für eine Runde
        (Rundenzeile der Anschreibetabelle, §5).
      required: [rolle, ist_geber, meldepunkte, stichwerte, mitpunkte, hat_eigenen_stich, stern]
      properties:
        rolle:
          type: string
          enum: [geber, spielmacher, gegenspieler]
          description: >-
            `geber` bedeutet „setzt aus" und kommt daher nur bei 4 Spielern vor. Bei 3 Spielern
            spielt der Geber mit und ist Spielmacher oder Gegenspieler (ADR-017).
        ist_geber:
          type: boolean
          description: >-
            Kennzeichnet den Geber der Runde – in beiden Varianten, im Gegensatz zu `rolle`.
        meldepunkte:
          type: integer
          description: Stich-zwang-gewertete Meldung (M); bei Schneider 0.
        stichwerte:
          type: integer
          description: Stichwerte (S).
        mitpunkte:
          type: integer
          description: +30 „Mit" für Gegenspieler bei Abgehen des Spielmachers, sonst 0.
        hat_eigenen_stich:
          type: boolean
          description: false → Meldung verfällt (Schneider, M als 0 angezeigt).
        stern:
          type: boolean
          description: Tausender-Stern (★) dieser Runde.

    HistorieRunde:
      type: object
      required:
        - rundennummer
        - sequenz
        - zaehlrunde
        - geber
        - spielmacher
        - reizwert
        - rundenausgang
        - ist_tausender
        - verlustwert
        - spieler
        - stand
      properties:
        rundennummer:
          type: integer
          description: Erfassungs-Sequenz (Identität, eindeutig, inkl. Tausender). Alias von `sequenz`.
        sequenz:
          type: integer
          description: Fortlaufende Erfassungs-Sequenz (max+1, ADR-016).
        zaehlrunde:
          type: integer
          nullable: true
          description: >-
            Gezählte Spielrunde (Runde X/Y). `null` bei Tausender, da diese außer
            Konkurrenz laufen und nicht als gespielte Runde zählen (§15.6/FND-006).
        geber:
          type: string
        spielmacher:
          type: string
        reizwert:
          type: integer
        rundenausgang:
          type: string
          description: Fachliche Ergebnis-Klassifikation der Runde (Klartext).
          enum:
            - gewonnenes Spiel
            - doppeltes Abgehen
            - einfaches Abgehen
            - Tausender gewonnen
            - Tausender verloren
        ist_tausender:
          type: boolean
        verlustwert:
          type: integer
          description: Negativer Verlustwert (-x) beim verlierenden Spielmacher, sonst 0.
        spieler:
          type: object
          description: Mapping Spielername → M|S|Mit-Zeile.
          additionalProperties:
            $ref: '#/components/schemas/HistorieSpielerZeile'
        stand:
          type: object
          description: Kumulierter STAND je Spieler nach dieser Runde.
          additionalProperties:
            type: integer

    Rundenhistorie:
      type: object
      required: [spiel_id, spieler, runden]
      properties:
        spiel_id:
          type: integer
        spieler:
          type: array
          description: Spielernamen in fester Sitzreihenfolge.
          items:
            type: string
        runden:
          type: array
          items:
            $ref: '#/components/schemas/HistorieRunde'
        zu_zahlen_cent:
          type: object
          description: >-
            Abrechnung bei sofortigem Spielende (rule-set-v1.md §20): Betrag je Spieler in
            **ganzen Cent** – 5 Cent je 10 Punkte Differenz zum Höchststand. Der Spitzenreiter zahlt 0;
            bei Gleichstand an der Spitze zahlen alle Spitzenreiter 0. Sterne fließen nicht ein.
          additionalProperties:
            type: integer
            minimum: 0
          examples:
            - { Anna: 125, Bernd: 0, Carla: 80, Dirk: 95 }
        sterne:
          type: object
          description: >-
            Summe der Tausender-Sterne je Spieler (rule-set-v1.md §15) – dieselbe Aggregation wie
            `/punktestaende/`. Die Anschreibetabelle zeigt sie in der Endabrechnung (§18.4).
          additionalProperties:
            type: integer
            minimum: 0
          examples:
            - { Anna: 0, Bernd: 2, Carla: 1, Dirk: 0 }
