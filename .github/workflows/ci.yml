name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: BDD Akzeptanztests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: uv einrichten
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Python 3.14 installieren
        working-directory: backend
        run: uv python install

      - name: Abhängigkeiten installieren
        working-directory: backend
        run: uv sync --dev

      - name: Django-Systemprüfung
        working-directory: backend
        run: uv run python manage.py check

      - name: Datenbankmigrationen prüfen (keine neuen Migrationen erforderlich)
        working-directory: backend
        run: uv run python manage.py makemigrations --check

      - name: BDD-Akzeptanztests ausführen (28/28 müssen GREEN sein)
        env:
          PYTHONPATH: backend
        run: backend/.venv/bin/python -m behave

  frontend:
    name: Frontend (Build + Vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node einrichten (Version aus .node-version)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren (reproduzierbar)
        working-directory: frontend
        run: npm ci

      - name: Produktions-Build (inkl. vue-tsc Typecheck)
        working-directory: frontend
        run: npm run build

      - name: Unit-/Komponententests (Vitest)
        working-directory: frontend
        run: npm test

  frontend-e2e:
    name: Frontend E2E-Smoke (Playwright)
    # Separater Job (ADR-013): E2E bleibt schlank und von Unit/Build isoliert.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node einrichten (Version aus .node-version)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren (reproduzierbar)
        working-directory: frontend
        run: npm ci

      - name: Playwright-Browser installieren (nur Chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E-Smoke ausführen (genau 1 Szenario)
        working-directory: frontend
        run: npm run test:e2e

  skript-lint:
    name: Deploy-Skripte prüfen (shellcheck + bash -n)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Shell-Skripte statisch prüfen
        # shellcheck ist auf ubuntu-latest-Runnern vorinstalliert — kein Ad-hoc-Download.
        # Grundsatz "automate everything, test everything": jede versionierte .sh wird
        # bei jedem Push/PR statisch geprüft; Fehler blockieren via CD-Gating den Deploy.
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "Keine .sh-Dateien im Repo gefunden — nichts zu prüfen."
            exit 0
          fi
          printf 'Geprüfte Skripte:\n'
          printf '  %s\n' "${scripts[@]}"
          echo "--- bash -n (Syntaxprüfung) ---"
          for f in "${scripts[@]}"; do
            echo "bash -n $f"
            bash -n "$f"
          done
          echo "--- shellcheck ---"
          shellcheck --version
          shellcheck "${scripts[@]}"
