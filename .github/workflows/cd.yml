name: CD – Deploy auf 1&1 VM

# Auslieferung erfolgt nur manuell oder nach explizitem Push auf den main-Branch.
# Automatisch wird NUR deployed, wenn alle CI-Tests bestehen.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Deploy auf Production bestätigen (yes)'
        required: true
        default: 'no'

jobs:
  deploy:
    name: Production-Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Bei workflow_run: nur wenn CI erfolgreich war.
    # Bei manuellem Dispatch: nur wenn explizit bestätigt.
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'yes')

    environment:
      name: production
      url: https://${{ vars.VM_HOST }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: SSH-Schlüssel einrichten
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: VM-Host zu known_hosts hinzufügen
        env:
          KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
        run: |
          # VM_SSH_KNOWN_HOSTS ist verpflichtend. Ein ssh-keyscan-Fallback zur
          # Laufzeit wäre blindes Trust-on-first-use bei JEDEM Deploy und böte
          # keinen MITM-Schutz — daher bewusst kein Fallback (siehe ADR-009).
          # Es ist eine (nicht-geheime) Repository-Variable: der Inhalt sind
          # öffentliche Host-Keys; der Schutz kommt aus dem Pinning, nicht aus
          # Vertraulichkeit.
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "❌ Variable VM_SSH_KNOWN_HOSTS ist nicht gesetzt." >&2
            echo "   Aus Sicherheitsgründen wird kein ssh-keyscan-Fallback verwendet." >&2
            echo "   Host-Keys einmalig mit 'ssh-keyscan -H <VM_HOST>' erzeugen und als Variable hinterlegen." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy-Preflight prüfen
        run: |
          ssh "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" << 'REMOTE'
            set -e
            echo "--- uv verfügbar?"
            command -v uv
            echo "--- App-Verzeichnis vorhanden?"
            test -d /opt/binokel/app
            echo "--- Umgebungsdatei vorhanden?"
            test -f /etc/binokel/env
            echo "--- systemd-Unit vorhanden?"
            test -f /etc/systemd/system/binokel-tracker.service
            echo "✅ Alle Preflight-Prüfungen bestanden"
          REMOTE

      - name: Code auf VM synchronisieren
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='*.pyc' \
            --exclude='__pycache__/' \
            --exclude='backend/db.sqlite3' \
            --exclude='backend/staticfiles/' \
            --exclude='backend/.venv/' \
            ./ \
            "${{ vars.VM_USER }}@${{ vars.VM_HOST }}:/opt/binokel/app/"

      - name: Abhängigkeiten installieren, Migrationen anwenden, Static Files sammeln
        run: |
          ssh "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" << 'REMOTE'
            set -e
            # migrate/collectstatic müssen exakt dieselben Pfade (DJANGO_DB_PATH,
            # DJANGO_STATIC_ROOT) verwenden wie der systemd-Dienst — sonst fielen die
            # Werte auf die Repo-Defaults zurück (backend/db.sqlite3, backend/staticfiles)
            # und der Dienst startete gegen eine leere DB. Ebenso muss UV_PYTHON_INSTALL_DIR
            # gesetzt sein, damit uv den Interpreter ins geteilte /opt/binokel/python legt.
            #
            # SICHERHEIT (E5): NICHT die gesamte env (inkl. DJANGO_SECRET_KEY) sourcen,
            # sondern nur die nicht-geheimen Pfad-Variablen lesen. migrate/collectstatic sind
            # schlüssel-unabhängig; für den settings.py-Import unter DEBUG=False genügt ein
            # EINMALIGER Wegwerf-Schlüssel — der echte Produktions-Key wird hier nie gelesen.
            # NIEMALS `set -x` in diesem Block (würde Variablen ins Actions-Log schreiben).
            export DJANGO_DEBUG=False
            export DJANGO_SECRET_KEY="deploy-only-$(openssl rand -hex 32)"
            export DJANGO_DB_PATH="$(sed -n 's/^DJANGO_DB_PATH=//p' /etc/binokel/env)"
            export DJANGO_STATIC_ROOT="$(sed -n 's/^DJANGO_STATIC_ROOT=//p' /etc/binokel/env)"
            export UV_PYTHON_INSTALL_DIR="$(sed -n 's/^UV_PYTHON_INSTALL_DIR=//p' /etc/binokel/env)"
            cd /opt/binokel/app/backend
            uv sync --no-dev
            uv run python manage.py migrate --noinput
            uv run python manage.py collectstatic --noinput
          REMOTE

      - name: Dienst neu starten
        run: |
          ssh "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" \
            "sudo systemctl restart binokel-tracker.service"

      - name: Healthcheck (max. 30 Sekunden warten)
        run: |
          for i in $(seq 1 10); do
            STATUS=$(ssh "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" \
              "curl -s -o /dev/null -w '%{http_code}' http://localhost/health/")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Healthcheck erfolgreich (HTTP $STATUS)"
              exit 0
            fi
            echo "⏳ Warte auf Dienst... ($i/10, HTTP $STATUS)"
            sleep 3
          done
          echo "❌ Healthcheck fehlgeschlagen — Diagnoseinformationen:"
          ssh "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" \
            "systemctl status binokel-tracker.service --no-pager || true"
          ssh "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" \
            "tail -n 50 /var/log/binokel/error.log || true"
          exit 1

      - name: Smoke-Test (öffentliches HTTPS-Deployment)
        # End-to-End-Abnahme vom Runner aus über das öffentliche Internet: prüft die
        # gesamte Kette TLS → Nginx → Gunicorn → Django. Ergänzt den vorherigen
        # (VM-internen) Readiness-Healthcheck um fachliche Sicherheits-Erwartungen.
        env:
          BASE: https://${{ vars.VM_HOST }}
        run: |
          set -uo pipefail
          fail=0

          check() {  # $1=Beschreibung  $2=erwarteter Code  $3=URL
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$3" || echo "000")
            if [ "$code" = "$2" ]; then
              echo "  ✅ $1 (HTTP $code)"
            else
              echo "  ❌ $1 — erwartet $2, erhalten $code"
              fail=1
            fi
          }

          echo "→ /health/ liefert 200 (End-to-End über TLS)"
          check "/health/" 200 "$BASE/health/"

          echo "→ /admin/ liefert 404 (Django-Admin bewusst entfernt, RD-6)"
          check "/admin/" 404 "$BASE/admin/"

          echo "→ HTTP wird auf HTTPS umgeleitet"
          check "HTTP→HTTPS-Redirect" 301 "http://${{ vars.VM_HOST }}/"

          echo "→ HSTS-Header ist gesetzt"
          if curl -sSI --max-time 15 "$BASE/health/" | tr -d '\r' | grep -iq '^strict-transport-security:'; then
            echo "  ✅ Strict-Transport-Security vorhanden"
          else
            echo "  ❌ Strict-Transport-Security fehlt"
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            echo "✅ Smoke-Test bestanden"
          else
            echo "❌ Smoke-Test fehlgeschlagen"
            exit 1
          fi

# ── Benötigte GitHub-Konfiguration ────────────────────────────────────────────
# Klassifikation nach Vertraulichkeit (Referenz-Best-Practice):
#
# SECRET  (Settings → Secrets and variables → Actions → Secrets, bzw. Environment):
#   VM_SSH_KEY            — SSH-Private-Key des Deploy-Benutzers (ohne Passphrase).
#                           EINZIGES echtes Geheimnis hier.
#
# VARIABLE (Settings → Secrets and variables → Actions → Variables, bzw. Environment):
#   VM_HOST               — Hostname oder IP der 1&1 VM (z. B. 192.0.2.10)
#   VM_USER               — Deploy-Benutzername auf der VM (z. B. binokel-deploy)
#   VM_SSH_KNOWN_HOSTS    — (PFLICHT) Bekannte Host-Keys der VM (MITM-Schutz).
#                           Inhalt: Zeile(n) im known_hosts-Format, z. B. aus
#                           `ssh-keyscan -H <VM_HOST>`. Nicht vertraulich (öffentliche
#                           Host-Keys) → als Variable; der Schutz kommt aus dem Pinning.
#                           Ohne diese Variable bricht der Deploy bewusst ab
#                           (kein ssh-keyscan-Fallback).
#
# Auf der VM als Umgebungsvariablen in /etc/binokel/env:
#   DJANGO_SECRET_KEY          — sicherer, zufälliger Schlüssel (min. 50 Zeichen)
#   DJANGO_DEBUG               — False
#   DJANGO_ALLOWED_HOSTS       — VM-Hostname oder Domain (z. B. binokel.example.com)
#   DJANGO_DB_PATH             — /opt/binokel/data/db.sqlite3
#   DJANGO_STATIC_ROOT         — /opt/binokel/static
#   DJANGO_CSRF_TRUSTED_ORIGINS — https://binokel.example.com
